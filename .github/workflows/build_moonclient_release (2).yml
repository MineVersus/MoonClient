name: Build & Publish MoonClient Release (1-Click Public Releases)

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Version Tag (e.g., v0.8.0-moon)'
        required: true
        default: 'v0.8.0-moon'
        type: string
      abi:
        description: 'Phone Architecture (arm64-v8a for 99% modern phones)'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - x86

permissions:
  contents: write

jobs:
  build-and-release-moonclient:
    name: Build & Publish MoonClient (${{ inputs.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11 & Pillow
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow for Setup Skin Pack
        run: pip install --upgrade pip pillow

      - name: Set up JDK 25 (with JDK 21 fallback)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Install Android SDK (Platform 35 & 36, Build-Tools 35.0.0, NDK r28c & r27)
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install Rust Toolchain, Android Targets & cargo-ndk
        run: |
          rustup show active-toolchain || rustup toolchain install stable
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked || cargo install cargo-ndk

      - name: Apply MoonClient Rebrand, Midnight Black Theme, Smooth 60FPS UI & .jar Fallback
        run: |
          python3 - << 'EOF'
          import re
          from pathlib import Path

          root = Path(".")

          def patch_regex(path: Path, rules):
              if not path.exists() or not path.is_file():
                  return
              txt = path.read_text(encoding="utf-8", errors="ignore")
              new_txt = txt
              for pat, rep in rules:
                  new_txt = re.sub(pat, rep, new_txt)
              if new_txt != txt:
                  path.write_text(new_txt, encoding="utf-8")
                  print(f"Patched: {path}")

          # 1. Rebrand Horizon Android / Starling -> MoonClient across Gradle, Manifests & XMLs
          for p in root.rglob("*"):
              if p.is_file() and p.suffix in {".gradle", ".kts", ".xml", ".json", ".py"}:
                  if ".github" in p.parts:
                      continue
                  patch_regex(p, [
                      (r"Horizon Android", "MoonClient"),
                      (r"Starling Preview", "MoonClient"),
                      (r'"Starling"', '"MoonClient"'),
                      (r'android:label="Horizon[^"]*"', 'android:label="MoonClient"'),
                      (r'android:label="Starling[^"]*"', 'android:label="MoonClient"'),
                      (r'>Starling<', '>MoonClient<'),
                      (r'>Horizon Android<', '>MoonClient<'),
                  ])

          # 2. Apply Pure AMOLED Midnight Black Theme (#000000, #08080C, #12121A, #38BDF8)
          #    and 16ms smooth transition frame pacing across Rust & UI files
          theme_rules = [
              (r'"Horizon Android"', '"MoonClient"'),
              (r'"Horizon Android ', '"MoonClient '),
              (r'"Starling"', '"MoonClient"'),
              (r'"Starling ', '"MoonClient '),
              (r"(?i)#0D0C14", "#000000"),
              (r"(?i)#171622", "#08080C"),
              (r"(?i)#252336", "#12121A"),
              (r"(?i)#5B4898", "#1E293B"),
              (r"(?i)#9A7BFF", "#38BDF8"),
              (r"0x0[dD],\s*0x0[cC],\s*0x14", "0x00, 0x00, 0x00"),
              (r"0x17,\s*0x16,\s*0x22", "0x08, 0x08, 0x0C"),
              (r"0x25,\s*0x23,\s*0x36", "0x12, 0x12, 0x1A"),
              (r"0x5[bB],\s*0x48,\s*0x98", "0x1E, 0x29, 0x3B"),
              (r"0x9[aA],\s*0x7[bB],\s*0x[fF][fF]", "0x38, 0xBD, 0xF8"),
              (r"Duration::from_millis\(33\)", "Duration::from_millis(16)"),
              (r"browsing-only", "installable (.jar content + .hmod)"),
          ]
          for folder in [root / "crates", root / "launcher", root / "packaging"]:
              if folder.exists():
                  for f in folder.rglob("*"):
                      if f.is_file() and f.suffix in {".rs", ".css", ".json", ".java", ".kt"}:
                          patch_regex(f, theme_rules)
          EOF

      - name: Auto-Detect Build Layout (Starling v0.8 vs Horizon v0.7.8) & Build APK
        run: |
          set -euxo pipefail
          mkdir -p release_assets
          ABI="${{ inputs.abi }}"

          if [ -f "packaging/lowbudget/make.py" ]; then
            python3 packaging/lowbudget/make.py || true
          fi

          if [ -f "packaging/android/build_apk.py" ]; then
            echo "Detected Starling unified branch (packaging/android/build_apk.py)"
            python3 packaging/android/build_apk.py --abi "$ABI" --release || \
            python3 packaging/android/build_apk.py --abi "$ABI" || \
            python3 packaging/android/build_apk.py
          elif [ -f "build_apk.py" ]; then
            echo "Detected root build_apk.py"
            python3 build_apk.py --abi "$ABI" --release || \
            python3 build_apk.py --abi "$ABI" || \
            python3 build_apk.py
          elif [ -f "tools/android_build.py" ]; then
            echo "Detected Horizon Android branch (tools/android_build.py)"
            if [ -f "tools/android_prepare.py" ]; then
              python3 tools/android_prepare.py
            fi
            python3 tools/android_build.py --abi "$ABI" --public || \
            python3 tools/android_build.py --abi "$ABI" --profile release
          else
            echo "Searching repository for build script..."
            BUILD_SCRIPT="$(find . -maxdepth 3 -name '*build*apk*.py' -o -name 'android_build.py' | head -n 1)"
            python3 "$BUILD_SCRIPT" --abi "$ABI" || python3 "$BUILD_SCRIPT"
          fi

          # Locate the built APK from target/android/, .local/android/apk/, or packaging/android/
          BUILT_APK="$(find . \( -path './target/android/*.apk' -o -path './.local/android/apk/*.apk' -o -path './packaging/android/*.apk' -o -name '*.apk' \) -type f | head -n 1)"
          if [ -z "$BUILT_APK" ]; then
            echo "ERROR: No APK file found after build!"
            exit 1
          fi
          echo "Found built APK: $BUILT_APK"
          cp "$BUILT_APK" "release_assets/MoonClient-0.8.0-${ABI}.apk"

          # Also package StarlingVisuals shaderpack if present
          if [ -d "packaging/shaderpacks/starling-visuals" ]; then
            (cd packaging/shaderpacks/starling-visuals && zip -r "../../../release_assets/MoonClientVisuals.zip" .) || true
          fi

          cp LICENSE release_assets/LICENSE.txt || true
          cp THIRD_PARTY_NOTICES.md release_assets/THIRD_PARTY_NOTICES.md || true
          cd release_assets
          sha256sum MoonClient-*.apk > SHA256SUMS.txt
          ls -lh

      - name: Upload MoonClient APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoonClient-0.8.0-${{ inputs.abi }}-APK
          path: release_assets/*
          if-no-files-found: error

      - name: Publish Public GitHub Release on MineVersus/MoonClient
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          # 🌙 MoonClient 0.8.0 (Midnight Black Edition)

          **MoonClient** is a customized Rust-powered Android port of Minecraft: Java Edition 26.3 (built on Starling / Horizon).

          ### ✨ What's New in MoonClient 0.8.0
          - **MoonClient Rebrand & Pure AMOLED Midnight Black Theme**: Deep `#000000` black backgrounds, `#08080C` obsidian surfaces, `#12121A` cards, and `#38BDF8` ice-blue accents.
          - **Ultra-Smooth 60+ FPS UI Transitions**: Locked `16ms` launcher frame pacing with smooth page slide/fade transitions.
          - **Offline Account & Custom Skin Wardrobe**: Full Offline Account support (16-char names) + local PNG Skin & Cape import with rotatable 3D Classic/Slim preview, plus Microsoft & Ely.by sign-in.
          - **Mod Support (`.hmod`, `.hnmod` & `.jar` Content/Data Packs)**: Native Rust `.hmod` & `.hnmod` mods, built-in Zoom/Minimap/Recipes/SmartF3, and Modrinth `.jar` asset/data-pack fallback extraction.
          EOF

          gh release create "${{ inputs.version_tag }}" release_assets/* \
            --repo "${{ github.repository }}" \
            --title "MoonClient 0.8.0 (${{ inputs.abi }})" \
            --notes-file release_notes.md || \
          gh release upload "${{ inputs.version_tag }}" release_assets/* \
            --repo "${{ github.repository }}" --clobber
